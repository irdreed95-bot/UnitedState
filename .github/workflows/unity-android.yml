name: Build Unity Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified 3D assets
        working-directory: Unity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          chmod +x scripts/download_assets.sh
          scripts/download_assets.sh

      - name: Build Unity Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: 6000.0.63f1
          targetPlatform: Android
          buildMethod: CorruptStateRP.Editor.BuildProject.BuildAndroid
          versioning: None

      - name: Sign APK with temporary debug certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="Unity/Builds/Android/CorruptStateRP.apk"
          test -f "$APK"

          KEYSTORE="Unity/debug.keystore"
          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"             >/dev/null 2>&1 || true

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             "$APK"

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="Unity/Builds/Android/CorruptStateRP.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          file "$APK" | grep -qi "zip"
          unzip -t "$APK" >/dev/null

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK verified and signed: $(stat -c%s "$APK") bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorruptStateRP-Unity-Android
          path: Unity/Builds/Android/CorruptStateRP.apk
          if-no-files-found: error
          compression-level: 0
