name: Build Unity Android AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Unity 6 Release Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download 3D assets
        working-directory: Unity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          chmod +x scripts/download_assets.sh
          scripts/download_assets.sh
      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/corruptstate-signing.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
            test -s "$KS"
            echo "SIGNING_MODE=release-secret" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI Debug,O=Corrupt State RP,C=US"
            echo "SIGNING_MODE=ci-debug-fallback" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
      - name: Build Unity Release AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: 6000.0.63f1
          targetPlatform: Android
          buildMethod: CorruptStateRP.Editor.BuildProject.BuildAndroid
          versioning: None
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="Unity/Builds/Android/CorruptStateRP.aab"
          test -f "$AAB"
          test "$(stat -c%s "$AAB")" -gt 1000000
          unzip -t "$AAB" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "AAB structure and signature verified; mode=$SIGNING_MODE; bytes=$(stat -c%s "$AAB")"
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CorruptStateRP-Android-AAB
          path: Unity/Builds/Android/CorruptStateRP.aab
          if-no-files-found: error
          compression-level: 0
