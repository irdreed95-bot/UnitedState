name: Build Unity Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Unity 6 Android APK (release secret when configured)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download 3D assets
        working-directory: Unity
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          chmod +x scripts/download_assets.sh
          scripts/download_assets.sh
      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        id: signing
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Unity/Builds"
          KS="$GITHUB_WORKSPACE/Unity/Builds/corruptstate-signing.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64_SECRET:-}" ]; then
            test -n "${ANDROID_KEYSTORE_PASSWORD_SECRET:-}" || { echo "::error::Missing GitHub Secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            test -n "${ANDROID_KEY_ALIAS_SECRET:-}" || { echo "::error::Missing GitHub Secret ANDROID_KEY_ALIAS"; exit 1; }
            test -n "${ANDROID_KEY_PASSWORD_SECRET:-}" || { echo "::error::Missing GitHub Secret ANDROID_KEY_PASSWORD"; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_BASE64_SECRET" | base64 --decode > "$KS"
            test -s "$KS"
            keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD_SECRET" -alias "$ANDROID_KEY_ALIAS_SECRET" >/dev/null
            echo "SIGNING_MODE=release-secret" >> "$GITHUB_ENV"
            {
              echo "keystore_base64<<EOF"
              printf '%s\n' "$ANDROID_KEYSTORE_BASE64_SECRET"
              echo "EOF"
              echo "keystore_password<<EOF"
              printf '%s\n' "$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "EOF"
              echo "key_alias<<EOF"
              printf '%s\n' "$ANDROID_KEY_ALIAS_SECRET"
              echo "EOF"
              echo "key_password<<EOF"
              printf '%s\n' "$ANDROID_KEY_PASSWORD_SECRET"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -noprompt -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI Debug,O=Corrupt State RP,C=US"
            echo "SIGNING_MODE=ci-debug-fallback" >> "$GITHUB_ENV"
            {
              echo "keystore_base64<<EOF"
              base64 -w0 "$KS"
              echo "EOF"
              echo "keystore_password<<EOF"
              echo "android"
              echo "EOF"
              echo "key_alias<<EOF"
              echo "androiddebugkey"
              echo "EOF"
              echo "key_password<<EOF"
              echo "android"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Android release signing secrets are absent. This run produces a debug-signed test APK, not a production release."
          fi
      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: 6000.0.63f1
          targetPlatform: Android
          androidExportType: androidPackage
          androidKeystoreName: corruptstate-signing.keystore
          androidKeystoreBase64: ${{ steps.signing.outputs.keystore_base64 }}
          androidKeystorePass: ${{ steps.signing.outputs.keystore_password }}
          androidKeyaliasName: ${{ steps.signing.outputs.key_alias }}
          androidKeyaliasPass: ${{ steps.signing.outputs.key_password }}
          buildMethod: CorruptStateRP.Editor.BuildProject.BuildAndroid
          versioning: None
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="Unity/Builds/Android/CorruptStateRP.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          unzip -t "$APK" >/dev/null
          
          echo "APK package structure verified; mode=$SIGNING_MODE; bytes=$(stat -c%s "$APK")"
      - name: Remove signing key
        if: always()
        run: rm -f Unity/Builds/corruptstate-signing.keystore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorruptStateRP-Android-APK
          path: Unity/Builds/Android/CorruptStateRP.apk
          if-no-files-found: error
          compression-level: 0
