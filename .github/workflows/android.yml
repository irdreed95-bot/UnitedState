name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "CorruptStateRP"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable; fi
      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/github/home/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          java -version
          test -d /usr/lib/android-sdk
      - name: Install Android SDK packages required by Godot 4.3
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Install Gradle Android build template
        run: |
          rm -rf android
          mkdir -p android/build
          printf "%s\n" "${GODOT_VERSION}.stable" > android/.build_version
          : > android/build/.gdignore
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          test -f android/build/build.gradle || test -f android/build/settings.gradle
      - name: Validate project
        run: godot --headless --path . --editor --quit --rendering-method gl_compatibility
      - name: Prepare Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
          test -s ~/.android/debug.keystore
      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"
          test -s "build/android/${EXPORT_NAME}.apk"
          ls -lh "build/android/${EXPORT_NAME}.apk"
      - name: Verify APK structure and signing
        run: |
          unzip -t "build/android/${EXPORT_NAME}.apk" >/dev/null
          APK_SIGNER="$(command -v apksigner || find /usr -name apksigner -type f | head -1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose "build/android/${EXPORT_NAME}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorruptStateRP-Android
          path: build/android/CorruptStateRP.apk
          if-no-files-found: error
