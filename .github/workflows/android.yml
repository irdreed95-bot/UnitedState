name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "CorruptStateRP"

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Install Android SDK packages required by Godot 4.3
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" "platforms;android-34"

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit --rendering-method gl_compatibility

      - name: Prepare Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"
          zipalign -f 4 "build/android/${EXPORT_NAME}.apk" "build/android/${EXPORT_NAME}-aligned.apk"
          mv "build/android/${EXPORT_NAME}-aligned.apk" "build/android/${EXPORT_NAME}.apk"
          apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "build/android/${EXPORT_NAME}.apk"
          apksigner verify --verbose "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorruptStateRP-Android
          path: build/android/CorruptStateRP.apk
          if-no-files-found: error
