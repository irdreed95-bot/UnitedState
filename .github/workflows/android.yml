name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "CorruptStateRP"

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit --rendering-method gl_compatibility

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CorruptStateRP-Android
          path: build/android/CorruptStateRP.apk
          if-no-files-found: error
