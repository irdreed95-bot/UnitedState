name: CSRP repository validation

on:
  push:
    branches: [main]
    paths:
      - "Unreal/**"
      - ".github/workflows/csrp-repository-validation.yml"
  pull_request:
    paths:
      - "Unreal/**"
      - ".github/workflows/csrp-repository-validation.yml"
  workflow_dispatch:

jobs:
  validate-unreal-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required UE5 foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "Unreal/CorruptStateRP.uproject"
            "Unreal/Config/DefaultEngine.ini"
            "Unreal/Config/DefaultGame.ini"
            "Unreal/Source/CorruptStateRP/CorruptStateRP.Build.cs"
            "Unreal/Source/CorruptStateRP/CSRPCharacter.cpp"
            "Unreal/Source/CorruptStateRP/CSRPPlayerState.cpp"
            "Unreal/Source/CorruptStateRP/CorruptStateGameMode.cpp"
            "Unreal/Source/CorruptStateRP/CSRPWorldBootstrap.cpp"
            "Unreal/Source/CorruptStateRP/CSRPCityLayout.cpp"
            "Unreal/Tools/BuildCSRPWorld.py"
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate Unreal project descriptor
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path("Unreal/CorruptStateRP.uproject")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("EngineAssociation"), "EngineAssociation is missing"
          plugins = {x.get("Name"): x.get("Enabled") for x in data.get("Plugins", [])}
          for name in ("EnhancedInput", "Interchange", "InterchangeEditor"):
              assert plugins.get(name) is True, f"{name} plugin is not enabled"

      - name: Validate world-build Python syntax
        shell: python
        run: |
          import ast
          from pathlib import Path
          ast.parse(Path("Unreal/Tools/BuildCSRPWorld.py").read_text(encoding="utf-8"))
          print("BuildCSRPWorld.py syntax OK")

      - name: Validate no-PC policy is present
        shell: bash
        run: |
          set -euo pipefail
          grep -q "does not have a PC" Unreal/NO_PC_BUILD_STRATEGY.md
          grep -q "not marked compiled" Unreal/NO_PC_BUILD_STRATEGY.md

      - name: Report UE runtime boundary
        shell: bash
        run: |
          echo "Repository validation passed."
          echo "This job does not claim to compile Unreal Engine because the runner does not contain a licensed UE5 toolchain."
          echo "A legitimate remote UE5 runner is still required for C++ compile, Editor automation, Play, and Android packaging."
