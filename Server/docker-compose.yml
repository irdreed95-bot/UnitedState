services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corruptstate
      POSTGRES_USER: corruptstate
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data,./sql:/docker-entrypoint-initdb.d:ro]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://corruptstate:change-me@postgres:5432/corruptstate
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: "*"
    depends_on: [postgres,redis]
    ports: ["8080:8080"]
volumes:
  postgres_data: